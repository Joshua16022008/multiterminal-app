<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multiterminal</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="usage.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="ports.css">
  <link rel="stylesheet" href="attachments.css">
  <link rel="stylesheet" href="handoff.css"><!-- F09 -->
  <link rel="stylesheet" href="worktree.css">
  <link rel="stylesheet" href="worktree-tree.css">
  <link rel="stylesheet" href="help.css">
  <link rel="stylesheet" href="agent-launch.css">
  <link rel="stylesheet" href="harness.css">
  <link rel="stylesheet" href="attention.css">
  <link rel="stylesheet" href="qol.css">
  <link rel="stylesheet" href="diff.css"><!-- F04 -->
  <link rel="stylesheet" href="search.css"><!-- F03 -->
  <link rel="stylesheet" href="workspace-templates.css"><!-- F08 -->
  <link rel="stylesheet" href="browser-feedback.css">
  <link rel="stylesheet" href="task-link.css"><!-- F10 -->
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-top drag"></div>
      <div class="side-settings">
        <button id="btn-settings" class="btn-small" aria-expanded="false" aria-controls="settings-panel" title="Persönliches Profil und Agent-Einstellungen">Einstellungen</button>
      </div>
      <div class="side-head">
        <span class="side-title">Projekte</span>
        <button id="add-project" class="btn-small" title="Projektordner hinzufügen">+ Projekt</button>
      </div>
      <ul id="project-list"></ul>
      <p id="side-empty" class="hint" hidden>Noch keine Projekte. Füge einen Ordner hinzu, um Terminals zu starten.</p>
    </aside>

    <main id="main">
      <header id="topbar" class="drag">
        <h1 id="ws-title"></h1>
        <span id="counter" class="counter"></span>
        <button id="btn-tree" class="btn-small tree-btn" hidden aria-expanded="false" aria-controls="worktree-view" title="Arbeitskopien-Stammbaum">⑂</button>
        <span class="spacer"></span>
        <div id="ws-actions">
          <div class="split">
            <button id="btn-plus" class="btn-primary split-main" aria-label="Neues Terminal" title="Neues Terminal">+</button>
            <button id="btn-menu" class="btn-primary split-arrow" aria-label="Agent auswählen" aria-expanded="false" aria-controls="menu" title="Agent auswählen">▾</button>
          </div>
        </div>
        <button id="btn-help" class="btn-small" aria-expanded="false" aria-controls="help-panel" aria-label="Hilfe" title="Hilfe">?</button>
        <button id="btn-toolbar" class="btn-small" aria-expanded="false" aria-controls="toolbar-options" title="Alle Optionen anzeigen">☰ Menü</button>
        <div id="toolbar-options" role="toolbar" aria-label="Optionen" aria-orientation="vertical" hidden>
        <button id="btn-qol" class="btn-small" aria-expanded="false" aria-controls="qol-panel" title="Komfort: Markierungen, Animationen, Sortierung und Aufgaben-Chip ein- und ausschalten">Komfort</button>
        <button id="btn-attention" class="btn-small" aria-expanded="false" aria-controls="attention-panel" title="Rückmeldungen der Agenten: wartet auf dich, Antwort fertig, Fehler (⌘J springt zur nächsten)">Rückmeldungen <span id="attention-count" class="attn-badge" hidden></span></button>
        <button id="btn-diff" class="btn-small" aria-expanded="false" aria-controls="diff-panel" title="Lokale Git-Änderungen ansehen und kommentieren">Änderungen</button><!-- F04 -->
        <button id="btn-pm" class="btn-small" title="Projektmanager für dieses Projekt in eigenem Fenster öffnen">◆ Projektmanager</button><!-- PM -->
        <button id="btn-ports" class="btn-small" aria-expanded="false" aria-controls="ports-panel" title="Lokale Devserver und lauschende Ports">Ports</button>
        <div id="project-options" class="toolbar-group">
          <button id="btn-live" class="btn-small" aria-pressed="false" title="Live-Diktat: an – Text erscheint schon beim Sprechen; aus – Text erscheint nach dem Stoppen am Stück">Live-Diktat</button>
          <button id="btn-accounts" class="btn-small" title="Konten der KI-Anbieter verwalten">Konten</button>
          <button id="btn-progress" class="btn-small" title="PROGRESS.md anzeigen">📋 Fortschritt</button>
          <button id="btn-handoff" class="btn-small" title="Kontrollierte Übergabe an ein anderes Terminal">⇄ Übergabe</button><!-- F09 -->
        </div>
        </div>
        <div id="qol-panel" hidden role="dialog" aria-label="Komfort-Einstellungen"></div>
      </header>
      <div id="content">
        <div id="grids"></div>
        <aside id="accounts-panel" hidden></aside>
        <aside id="progress-panel" hidden></aside>
        <aside id="attention-panel" hidden aria-label="Rückmeldungen der Agenten"></aside>
        <aside id="diff-panel" hidden aria-label="Projektänderungen"></aside><!-- F04 -->
        <aside id="ports-panel" hidden aria-label="Devserver und Ports"></aside>
        <section id="settings-panel" hidden aria-label="Einstellungen"></section>
        <section id="worktree-view" hidden aria-label="Arbeitskopien-Stammbaum"></section>
        <div id="empty-main" hidden>
          <p>Kein Projekt ausgewählt.</p>
          <button id="empty-add" class="btn-primary">+ Projekt hinzufügen</button>
        </div>
      </div>
    </main>
  </div>

  <div id="menu" class="menu" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="notices"></div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../../node_modules/@xterm/addon-serialize/lib/addon-serialize.js"></script>
  <script src="layout.js"></script>
  <script src="hotkeys.js"></script>
  <script src="reorder.js"></script>
  <script src="browser-view.js"></script>
  <script src="dictation.js"></script>
  <script src="attention-panel.js"></script>
  <script src="activity.js"></script>
  <script src="qol-panel.js"></script>
  <script src="task-link.js"></script><!-- F10 -->
  <script src="tree-layout.js"></script>
  <script src="terminal-pane.js"></script>
  <script src="worktree-tree.js"></script>
  <script src="attachments.js"></script>
  <script src="prompt-draft.js"></script>
  <script src="progress-panel.js"></script>
  <script src="handoff-panel.js"></script><!-- F09 -->
  <script src="usage-view.js"></script>
  <script src="accounts-panel.js"></script>
  <script src="ports-panel.js"></script>
  <script src="diff-panel.js"></script><!-- F04 -->
  <script src="settings-panel.js"></script>
  <script src="harness-panel.js"></script>
  <script src="github-panel.js"></script>
  <script src="sidebar-tooltips.js"></script>
  <script src="worktree-picker.js"></script>
  <script src="agent-launch.js"></script>
  <script src="terminal-search.js"></script><!-- F03 -->
  <script src="command-palette.js"></script><!-- F03 -->
  <script src="guide-markdown.js"></script>
  <script src="help-panel.js"></script>
  <script src="workspace-templates.js"></script><!-- F08 -->
  <script src="browser-feedback.js"></script>
  <script src="pm-send.js"></script><!-- PM -->
  <script src="app.js"></script>
</body>
</html>
